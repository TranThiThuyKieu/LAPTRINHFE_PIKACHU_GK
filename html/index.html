<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pikachu</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="khung-game">
    <div class="lop-nen-mo"></div>
    <div class="man-hinh-menu" id="manHinhMenu">
        <h1 class="tieude-game">PIKACHU</h1>
        <div class="nhom-chon-level">
            <label for="chonLevel">CHỌN MỨC ĐỘ:</label>
            <select id="chonLevel">
                <option value="lv1">Level 1</option>
                <option value="lv2">Level 2</option>
                <option value="lv3">Level 3</option>
                <option value="lv4">Level 4</option>
                <option value="lv5">Level 5</option>
                <option value="lv6">Level 6</option>
            </select>
        </div>
        <div class="nhom-nut-bam">
            <button class="nut-bam nut-bat-dau" id="nutBatDau">BẮT ĐẦU CHƠI</button>
            <button class="nut-bam nut-huong-dan" id="nutHuongDan">HƯỚNG DẪN</button>
        </div>
    </div>
</div>
<script src="../js/script.js"></script>
</body>
</html>
