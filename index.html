<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Pikachu</title>
    <style>body {
        margin: 10px;
        text-align: center;
        font-family: sans-serif;
        background-color: #f4f4f9;
    }
    h1, #level-title {
        color: #2563eb;
    }
    h1 {
        margin: 5px 0;
    }
    h3 {
        margin: 5px 0;
    }
    #level-desc {
        margin: 5px 0 10px 0;
        color: #64748b;
        font-style: italic;
    }
    .control-panel {
        margin-bottom: 10px;
    }
    #guide {
        margin: 10px 0;
        color: #64748b;
        font-size: 14px;
    }
    .control-panel button,
    .control-panel select {
        padding: 6px 14px;
        margin: 0 4px;
        cursor: pointer;
    }
    .control-panel button:disabled {
        cursor: not-allowed;
    }
    #game-container {
        position: relative;
        display: inline-block;
    }
    #time-container {
        width: 100%;
        height: 10px;
        background: #e2e8f0;
        margin-bottom: 10px;
    }
    #time-bar {
        height: 100%;
        width: 100%;
        background: #22c55e;
    }
    #line-canvas {
        position: absolute;
        top: 20px;
        left: 0;
        pointer-events: none;
        z-index: 10;
    }
    #game {
        border-collapse: collapse;
        margin: auto;
        background-color: #ffffff;
    }
    #game.blur-light { filter: blur(2px); }
    #game.blur-heavy { filter: blur(3px); }
    .cell {
        position: relative;
        width: 38px;
        height: 42px;
        border: 1px solid #e2e8f0;
        padding: 0;
        box-sizing: border-box;
        cursor: pointer;
    }
    .empty {
        border-color: transparent;
        background-color: transparent;
        cursor: default;
    }
    .cell.selected {
        outline: 3px solid #1d4ed8;
        outline-offset: -3px;
        background-color: #dbeafe !important;
    }
    .card-img {
        width: 100%;
        height: 100%;
        box-sizing: border-box;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        --dx: 0px;
        --dy: 0px;
    }
    .overlay {
        position: absolute;
        top: 20px;
        left: 0;
        width: 100%;
        height: calc(100% - 20px);
        background: rgba(255, 255, 255, 0.95);
        z-index: 20;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }
    .hidden {
        display: none;
    }
    .overlay h2 {
        margin-bottom: 10px;
    }
    .overlay p {
        margin-bottom: 15px;
        color: #64748b;
    }
    .btn-primary {
        padding: 10px 20px;
        font-weight: bold;
        background: #2563eb;
        color: white;
        border: none;
        cursor: pointer;
    }
    .result-buttons button {
        margin: 0 6px;
    }
    #tip {
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #1e293b;
        color: white;
        padding: 10px 20px;
        z-index: 30;
        pointer-events: none;
        opacity: 0;
    }
    #tip.show { opacity: 1; }
    .cell.hint {
        outline: 3px solid #eab308;
        animation: blinkHint 0.6s infinite alternate;
    }
    @keyframes blinkHint {
        from { opacity: 0.5; }
        to   { opacity: 1; }
    }
    .cell.portal-1 { background-color: #ef4444; }
    .cell.portal-2 { background-color: #22c55e; }
    .cell.portal-3 { background-color: #a855f7; }
    .cell.bubble .card-img {
        background-color: #a8a29e;
        border: 4px solid #292524;
        box-shadow: inset 0 0 8px #000;
    }
    .cell.pop .card-img {
        animation: stoneShake 0.3s;
    }
    @keyframes stoneShake {
        0%   { transform: translateX(0); }
        25%  { transform: translateX(-3px); }
        75%  { transform: translateX(3px); }
        100% { transform: translateX(0); }
    }
    .cell.trail { background-color: #fca5a5; }
    .cell.trail-old { background-color: #fee2e2; }
    .cell.ice .card-img {
        background-color: #e0f2fe;
        border: 3px solid #0284c7;
        box-shadow: inset 0 0 8px #38bdf8;
    }
    @keyframes iceSlide {
        from { transform: translate(var(--dx), var(--dy)); }
        to   { transform: translate(0, 0); }
    }
    .card-img.slide { animation: iceSlide 0.25s ease-out; }
    .cell.lock-1 { --c: red; }
    .cell.lock-2 { --c: green; }
    .cell.lock-3 { --c: purple; }
    .cell.lock-4 { --c: orange; }
    .cell.key .card-img {
        border: 4px solid var(--c);
    }
    .cell.locked {
        cursor: not-allowed;
    }
    .cell.locked .card-img {
        border: 3px dashed var(--c);
        opacity: 0.4;
    }
    .cell.stacked {
        background-color: #fef3c7;
    }
    .cell.stacked .card-img {
        position: relative;
        background-color: #fff;
        border: 2px solid #b45309;
        transform: translate(-2px, -2px);
        box-shadow: 3px 3px 0 #92400e;
    }
    .under-img {
        position: absolute;
        top: 5px;
        left: 5px;
        width: 100%;
        height: 100%;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        opacity: 0.45;
    }</style>
</head>
<body>
<h1>GAME PIKACHU</h1>
<h3>Màn chơi: <span id="level-title">Level 1</span></h3>
<p id="level-desc"></p>
<div class="control-panel">
    <label><b>Level:</b></label>
    <select id="level-select">
        <option value="1">Level 1</option>
        <option value="2">Level 2</option>
        <option value="3">Level 3</option>
        <option value="4">Level 4</option>
        <option value="5">Level 5</option>
        <option value="6">Level 6</option>
        <option value="7">Level 7</option>
        <option value="8">Level 8</option>
    </select>
    <button id="btn-restart">Chơi Lại</button>
    <button id="btn-pause">Tạm Dừng</button>
    <button id="btn-shuffle">Đổi Vị Trí</button>
    <button id="btn-hint">Gợi Ý</button>
</div>
<div id="game-container">
    <div id="time-container">
        <div id="time-bar"></div>
    </div>
    <canvas id="line-canvas"></canvas>
    <table id="game"></table>
    <div id="start-overlay" class="overlay hidden">
        <h2>SẴN SÀNG CHƠI!</h2>
        <p>Bấm nút bên dưới để bắt đầu chơi.</p>
        <button id="btn-start" class="btn-primary">BẮT ĐẦU</button>
    </div>
    <div id="pause-overlay" class="overlay hidden">
        <h2>ĐÃ TẠM DỪNG GAME</h2>
        <p>Trò chơi đang dừng. Bấm nút bên dưới để chơi tiếp!</p>
        <button id="btn-resume" class="btn-primary">Tiếp Tục Chơi</button>
    </div>
    <div id="result-overlay" class="overlay hidden">
        <h2 id="result-title"></h2>
        <p id="result-msg"></p>
        <div class="result-buttons">
            <button id="btn-result-replay" class="btn-primary">Chơi Lại</button>
            <button id="btn-result-next" class="btn-primary">Màn Tiếp Theo</button>
        </div>
    </div>
    <div id="tip">Hết nước đi!</div>
</div>
<p id="guide">Hướng dẫn sử dụng: <a href="https://docs.google.com/document/d/1-45G9zrNSmfzrTo4Fw8vpo07vdKI3tIc3vu3n4AgV_U/edit?usp=sharing" target="_blank">Tại đây</a>
    <br>https://docs.google.com/document/d/1-45G9zrNSmfzrTo4Fw8vpo07vdKI3tIc3vu3n4AgV_U/edit?usp=sharing</p>
<script src="game.js"></script>
</body>
</html>
