<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Pikachu - Layout Mới</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-dashboard">
        <header class="dau-man-hinh">
            <h1>PIKACHU GAME</h1>
        </header>
        <div class="noi-dung-game">
            <aside class="cot-dieu-khien">
                <h3 class="tieude-nhom">HỆ THỐNG</h3>
                <button class="nut-dieu-khien">Tạm Dừng</button>
                <button class="nut-dieu-khien">Chơi Lại</button>
                <button class="nut-dieu-khien">Chọn Level</button>
                <button class="nut-dieu-khien">Chế độ: Sáng</button>
                <button class="nut-dieu-khien">Âm thanh: Bật</button>
            </aside>
            <main class="cot-man-hinh-chinh">
                <div class="khung-chua-game">
                    <div class="the-bat-dau">
                        <h2 class="ten-game">Pikachu Game</h2>
                        <p class="mo-ta-game">Chọn level và nhấn Bắt đầu để bắt đầu chơi.</p>
                        <button class="nut-bat-dau-lon">Bắt Đầu</button>
                    </div>
                </div>
            </main>
            <aside class="cot-thong-so">
                <h3 class="tieude-nhom">THÔNG SỐ</h3>
                <div class="the-so-lieu">
                    <span class="label">BÀN</span>
                    <span class="value">1</span>
                </div>
                <div class="the-so-lieu">
                    <span class="label">ĐIỂM</span>
                    <span class="value">0</span>
                </div>
                <div class="the-so-lieu">
                    <span class="label">KỶ LỤC</span>
                    <span class="value">60</span>
                </div>
                <h3 class="tieude-nhom do-cach">TRỢ GIÚP</h3>
                <button class="nut-tro-giup">Đổi vị trí (10)</button>
                <button class="nut-tro-giup">Gợi ý (3)</button>
            </aside>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
